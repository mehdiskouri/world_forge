repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=5120"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pinned to match the version declared in pyproject.toml [dependency-groups].
    # Bump both files together.
    rev: v0.15.12
    hooks:
      - id: ruff
        args: ["--exit-non-zero-on-fix"]
      - id: ruff-format
        args: ["--check"]

  # Note: mypy is intentionally NOT a pre-commit hook. The pre-commit
  # mypy mirror runs in an isolated venv that does not see the
  # project's dev/runtime dependencies (pydantic, mcp, pytest, etc.),
  # which produces spurious "Cannot find implementation" errors. The
  # CI workflow runs ``uv run mypy`` directly with the full
  # environment, which is the source of truth for type-checking.
