name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: lint + type-check + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv (with built-in cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Set up Node 22 LTS
        # Phase 7 Stage F — the popup canvas + connection-map frontend
        # is a Vite + TS bundle under ``forge_mcp/canvas_page/``.
        # ``npm ci`` + ``npm run build`` must run **before** ``uv sync``
        # because ``pyproject.toml`` force-includes
        # ``forge_mcp/canvas_page/dist`` in the wheel — hatchling
        # refuses to build (even editable) when the directory is
        # missing.
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: forge_mcp/canvas_page/package-lock.json

      - name: Install canvas-page dependencies
        run: npm ci --prefix forge_mcp/canvas_page

      - name: Build canvas-page bundle
        run: npm run build --prefix forge_mcp/canvas_page

      - name: Test canvas-page bundle (Vitest)
        run: npm run test --prefix forge_mcp/canvas_page

      - name: Type-check canvas-page bundle (tsc --noEmit)
        run: npm run typecheck --prefix forge_mcp/canvas_page

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Pre-commit (ruff, ruff-format, hooks, mypy)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Mypy (strict)
        run: uv run mypy

      - name: Mypy — Blender-internal scripts (separate, soft in Phase 1)
        # scripts/blender/* runs inside Blender's interpreter and imports
        # `bpy` natively. Type-checked separately against fake-bpy-module-5.0
        # stubs. Soft (continue-on-error) in Phase 1; hardened from Phase 4.
        # See .github/instructions.md §2 and scripts/blender/README.md.
        if: hashFiles('scripts/blender/*.py') != ''
        continue-on-error: true
        run: uv run mypy --no-incremental scripts/blender

      - name: Pytest (with coverage; 90% branch floor from Phase 2)
        # Phase 2 turned on the coverage floor + branch coverage per
        # AGENT/dev_phases/phase2.md Stage A item 3 / .github/instructions.md §3.
        run: >-
          uv run pytest --cov=forge_mcp --cov-branch
          --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Schema drift (forge-schema-export --check)
        # Phase 2 Stage A item 3: every published JSON Schema must match
        # its live Pydantic model. CLI fails non-zero on any drift; the
        # fix is `uv run forge-schema-export --write`.
        run: uv run forge-schema-export --check
