<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forge canvas</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: #11141a;
        color: #eaecef;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #toolbar {
        position: absolute;
        top: 0.5rem;
        left: 0.5rem;
        z-index: 10;
        display: flex;
        gap: 0.5rem;
        padding: 0.5rem 0.75rem;
        background: rgba(10, 12, 18, 0.85);
        border-radius: 6px;
        font-size: 0.875rem;
      }
      #toolbar a,
      #toolbar button {
        color: #eaecef;
        text-decoration: none;
        background: transparent;
        border: 1px solid #3a4250;
        padding: 0.25rem 0.6rem;
        border-radius: 4px;
        font: inherit;
        cursor: pointer;
      }
      #toolbar a.active,
      #toolbar button.active {
        background: #2a5fad;
        border-color: #2a5fad;
      }
      #status {
        position: absolute;
        bottom: 0.5rem;
        left: 0.5rem;
        z-index: 10;
        padding: 0.25rem 0.5rem;
        background: rgba(10, 12, 18, 0.85);
        border-radius: 4px;
        font-size: 0.75rem;
        color: #9aa3b2;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <nav id="toolbar">
        <a href="?view=canvas" data-view="canvas">Canvas</a>
        <a href="?view=connection-map" data-view="connection-map"
          >Connection map</a
        >
      </nav>
      <div id="stage"></div>
      <div id="status">connecting…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
