[project]
name = "forge"
version = "0.0.0"
description = "Agent-native worldbuilding MCP server (Forge v1)."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Mehdi" }]
keywords = [
    "mcp",
    "worldbuilding",
    "blender",
    "procedural-generation",
    "agent",
    "hypergraph",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.27.0",
    "numpy>=2.0",
    "pillow>=10.4",
    "pydantic>=2.13.0",
    "scipy>=1.13",
    "shapely>=2.0",
]

[project.urls]
Homepage = "https://github.com/mehdi/world_forge"
Repository = "https://github.com/mehdi/world_forge"
Issues = "https://github.com/mehdi/world_forge/issues"

[project.scripts]
# Phase 1 spike 3: ``forge-mcp`` is the MCP server entry point that an
# agent host (Claude Desktop / Claude Code / Cursor) launches over stdio.
forge-mcp = "forge_mcp.server.mcp:main"
# Phase 2 Stage A/B: regenerate or verify every published JSON Schema
# under ``schemas/``. CI runs ``forge-schema-export --check`` on every
# pull request (.github/workflows/ci.yml).
forge-schema-export = "forge_mcp.project.schema_export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge_mcp"]

[dependency-groups]
dev = [
    "ruff==0.15.12",
    "mypy==1.20.2",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.0",
    # bpy type stubs for Blender-internal scripts. Not used at runtime
    # (real bpy is supplied by Blender 5.0.0); see scripts/blender/README.md
    # and .github/instructions.md §2.
    "fake-bpy-module-5.0==20260128",
    "types-shapely>=2.1.0.20260408",
    "freezegun>=1.5.5",
    "types-pillow>=10.2.0.20240822",
]

# ---------------------------------------------------------------------------
# Ruff — strict-from-day-one configuration. Do not widen `ignore` or
# `per-file-ignores` without an explicit RELAX PR (.github/instructions.md §2).
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["forge_mcp", "tests"]
# scripts/blender/* runs in Blender's embedded Python interpreter against the
# real ``bpy`` module. It is exercised manually (Phase 1 spikes 1 and 2) and
# lives outside the strict matrix — mirrors the mypy exclude in [tool.mypy].
extend-exclude = ["scripts/blender"]

[tool.ruff.lint]
select = ["ALL"]
# Minimal, justified ignores only:
#   D203 / D211     — incompatible pair; D211 (no blank line before class) wins.
#   D213 / D212     — incompatible pair; D212 (multi-line summary on first line) wins.
#   COM812          — trailing-comma rule conflicts with the formatter.
#   ISC001          — implicit-string-concat rule conflicts with the formatter.
ignore = ["D203", "D213", "COM812", "ISC001"]

[tool.ruff.lint.per-file-ignores]
# This is the ENTIRE allowed per-file-ignore list. Do not add more.
"tests/**/*.py" = ["S101", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
# Use defaults; let the formatter own style.

# ---------------------------------------------------------------------------
# Mypy — strict mode plus additional tightening. Never relax.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_any_unimported = true
disallow_any_explicit = true
extra_checks = true
mypy_path = "stubs"
enable_error_code = [
    "ignore-without-code",
    "redundant-self",
    "truthy-bool",
    "possibly-undefined",
]
files = ["forge_mcp", "tests"]
# scripts/blender/* runs INSIDE Blender's own Python interpreter and imports
# `bpy` natively. It is type-checked SEPARATELY (see CI "mypy-blender-scripts"
# step) using fake-bpy-module-5.0 stubs, so it is excluded from the strict
# main run. This is the only acceptable mypy carve-out (instructions §2).
exclude = ["scripts/blender/.*"]

[[tool.mypy.overrides]]
# Blender-internal scripts: relax `disallow_any_explicit` only here so the
# adapter can pass through opaque bpy return values without ceremony.
# Run separately; never picked up by the main `uv run mypy` invocation.
module = ["adapter", "introspect"]
disallow_any_explicit = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
testpaths = ["tests"]
markers = [
    "blender_integration: tests that spawn a real Blender 5.0 process; gated on $FORGE_BLENDER_BIN",
]

# ---------------------------------------------------------------------------
# Coverage — branch coverage on. Threshold enforcement is enabled in CI from
# Phase 2 onward (.github/instructions.md §3); Phase 0 only has a smoke test.
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["forge_mcp"]

[tool.coverage.report]
show_missing = true
skip_covered = false
